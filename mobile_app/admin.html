<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Administración · Llama a Jaime</title>
<style>
:root{--navy:#073b66;--navy2:#052d4f;--bg:#f3f7fa;--card:#fff;--line:#dbe5ec;--text:#183247;--muted:#667d8e;--green:#17834c;--red:#b42318;--amber:#a15c00;--blue:#1261a0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,var(--navy2),var(--navy))}
.login-card{width:min(430px,100%);background:#fff;border-radius:24px;padding:30px;box-shadow:0 22px 60px #001b2e55}
.brand{font-weight:900;font-size:25px;color:var(--navy)}.sub{color:var(--muted);margin:6px 0 24px}.field{margin:14px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}
.field input,.field textarea,.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--text)}
.primary{border:0;background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-weight:800}.full{width:100%}.error{color:var(--red);font-size:13px;margin-top:12px}
.top{height:68px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}
.top strong{font-size:18px}.top small{opacity:.8}.top button{background:#ffffff18;border:1px solid #ffffff44;color:#fff;border-radius:10px;padding:9px 12px}
.shell{max-width:1400px;margin:auto;padding:22px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr 180px 180px auto;gap:10px;background:#fff;border:1px solid var(--line);padding:14px;border-radius:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:minmax(350px,.8fr) minmax(0,1.4fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panel-title{padding:16px 18px;border-bottom:1px solid var(--line);font-weight:850}.list{max-height:calc(100vh - 270px);overflow:auto}
.person{padding:15px 17px;border-bottom:1px solid var(--line);cursor:pointer}.person:hover,.person.active{background:#eef6fb}.person h3{margin:0 0 5px;font-size:15px}.meta{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin:6px 4px 0 0}.pendiente{background:#fff2cc;color:#775300}.verificado,.activa{background:#dff5e8;color:#12633a}.rechazado,.suspendida{background:#fde5e3;color:#8e1b13}.detail{padding:20px;min-height:480px}
.empty{color:var(--muted);padding:45px 20px;text-align:center}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:15px}
.head h2{margin:0 0 4px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}.fact{border:1px solid var(--line);border-radius:12px;padding:11px}.fact small{display:block;color:var(--muted);margin-bottom:4px}.fact b{word-break:break-word}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-weight:750}.ok{background:var(--green);color:#fff;border-color:var(--green)}.danger{background:var(--red);color:#fff;border-color:var(--red)}.warn{background:var(--amber);color:#fff;border-color:var(--amber)}
.section{margin-top:20px}.section h3{font-size:15px;margin:0 0 9px}.event{border-left:3px solid var(--line);padding:7px 10px;margin:7px 0;font-size:13px}.claim{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.loading{padding:20px;color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:#00152299;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(520px,100%);background:#fff;border-radius:18px;padding:20px}.modal h3{margin-top:0}.modal textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:11px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.list{max-height:420px}}@media(max-width:520px){.shell{padding:12px}.toolbar{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.top{padding:0 14px}}
</style>
</head>
<body>
<section id="loginView" class="login">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand">Llama a Jaime</div><div class="sub">Panel privado de administración</div>
    <div class="field"><label>Correo administrador</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button id="loginBtn" class="primary full" type="submit">Ingresar</button>
    <div id="loginError" class="error"></div>
  </form>
</section>

<section id="appView" class="hidden">
<header class="top"><div><strong>Llama a Jaime · Admin</strong><br><small id="adminLabel"></small></div><button id="logoutBtn">Cerrar sesión</button></header>
<main class="shell">
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Prestadores</span></div>
    <div class="stat"><b id="sPending">0</b><span>Pendientes</span></div>
    <div class="stat"><b id="sVerified">0</b><span>Verificados</span></div>
    <div class="stat"><b id="sSuspended">0</b><span>Suspendidos</span></div>
  </div>
  <div class="toolbar">
    <input id="search" placeholder="Buscar nombre, correo o teléfono">
    <select id="verification"><option value="">Toda verificación</option><option value="pendiente">Pendientes</option><option value="verificado">Verificados</option><option value="rechazado">Rechazados</option></select>
    <select id="account"><option value="">Todas las cuentas</option><option value="activa">Activas</option><option value="suspendida">Suspendidas</option><option value="cerrada">Cerradas</option></select>
    <button id="refresh" class="btn">Actualizar</button>
  </div>
  <div class="grid">
    <section class="panel"><div class="panel-title">Prestadores</div><div id="providerList" class="list"><div class="loading">Cargando…</div></div></section>
    <section class="panel"><div id="detail" class="detail"><div class="empty">Selecciona un prestador para abrir su ficha.</div></div></section>
  </div>
</main>
</section>

<div id="modalBg" class="modal-bg hidden"><div class="modal"><h3 id="modalTitle"></h3><p id="modalText"></p><textarea id="observation" placeholder="Observación interna"></textarea><div class="modal-actions"><button id="cancelModal" class="btn">Cancelar</button><button id="confirmAction" class="primary">Confirmar</button></div></div></div>

<script>
const API="/app/api"; let token=sessionStorage.getItem("lja_admin_token")||""; let admin=null; let providers=[]; let selected=null; let pendingAction=null;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function date(v){if(!v)return "—";try{return new Intl.DateTimeFormat("es-CL",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v))}catch{return v}}
function badge(v){return `<span class="badge ${esc(v)}">${esc(v||"—")}</span>`}
async function api(path,opt={}){const headers={"Content-Type":"application/json",...(opt.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(API+path,{...opt,headers,cache:"no-store"});let d={};try{d=await r.json()}catch{}if(r.status===401&&path!=="/admin/login"){logout();throw new Error("Tu sesión venció.")}if(!r.ok||d.ok===false)throw new Error(d.error||"Error de servidor");return d}
function showApp(){ $("loginView").classList.add("hidden");$("appView").classList.remove("hidden");$("adminLabel").textContent=`${admin.nombre} · ${admin.rol}` }
function logout(){token="";admin=null;sessionStorage.removeItem("lja_admin_token");$("appView").classList.add("hidden");$("loginView").classList.remove("hidden");$("password").value=""}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";$("loginBtn").disabled=true;try{const d=await api("/admin/login",{method:"POST",body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})});token=d.access_token;admin=d.admin;sessionStorage.setItem("lja_admin_token",token);showApp();await loadProviders()}catch(err){$("loginError").textContent=err.message}finally{$("loginBtn").disabled=false}})
$("logoutBtn").onclick=logout;
async function restore(){if(!token)return;try{const d=await api("/admin/me");admin=d.admin;showApp();await loadProviders()}catch{}}
async function loadProviders(){let q=new URLSearchParams();if($("verification").value)q.set("verificacion",$("verification").value);if($("account").value)q.set("cuenta",$("account").value);if($("search").value.trim())q.set("q",$("search").value.trim());q.set("limit","200");$("providerList").innerHTML='<div class="loading">Cargando…</div>';try{const d=await api("/admin/prestadores?"+q);providers=d.prestadores||[];renderList();updateStats()}catch(e){$("providerList").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function updateStats(){$("sTotal").textContent=providers.length;$("sPending").textContent=providers.filter(x=>x.estado_verificacion==="pendiente").length;$("sVerified").textContent=providers.filter(x=>x.estado_verificacion==="verificado").length;$("sSuspended").textContent=providers.filter(x=>x.estado_cuenta==="suspendida").length}
function renderList(){if(!providers.length){$("providerList").innerHTML='<div class="empty">No hay prestadores con estos filtros.</div>';return}$("providerList").innerHTML=providers.map(p=>`<div class="person ${selected===p.id?"active":""}" data-id="${p.id}"><h3>${esc(p.nombre||"Sin nombre")}</h3><div class="meta">${esc(p.email||p.telefono||"Sin contacto")}</div>${badge(p.estado_verificacion)}${badge(p.estado_cuenta)}</div>`).join("");document.querySelectorAll(".person").forEach(el=>el.onclick=()=>openProvider(el.dataset.id))}
async function openProvider(id){selected=id;renderList();$("detail").innerHTML='<div class="loading">Abriendo ficha…</div>';try{const d=await api(`/admin/prestadores/${id}`);renderDetail(d.prestador,d.historial||[],d.reclamos||[])}catch(e){$("detail").innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
function arr(v){return Array.isArray(v)?v.join(", "):(v||"—")}
function renderDetail(p,hist,claims){const canSuspend=admin.rol!=="moderador";$("detail").innerHTML=`
<div class="head"><div><h2>${esc(p.nombre||"Prestador")}</h2><div class="meta">Registro: ${date(p.created_at)}</div></div><div>${badge(p.estado_verificacion)}${badge(p.estado_cuenta)}</div></div>
<div class="facts">
<div class="fact"><small>RUT</small><b>${esc(p.rut_normalizado||"—")}</b></div><div class="fact"><small>Teléfono</small><b>${esc(p.telefono||p.telefono_normalizado||"—")}</b></div>
<div class="fact"><small>Correo</small><b>${esc(p.email||"—")}</b></div><div class="fact"><small>Radio</small><b>${esc(p.radio_km??"—")} km</b></div>
<div class="fact"><small>Roles / categorías</small><b>${esc(arr(p.roles))}</b></div><div class="fact"><small>Especialidades</small><b>${esc(arr(p.especialidades))}</b></div>
<div class="fact"><small>Comunas</small><b>${esc(arr(p.comunas))}</b></div><div class="fact"><small>Vehículo</small><b>${esc(p.vehiculo||"—")}</b></div>
<div class="fact"><small>Disponible</small><b>${p.disponible?"Sí":"No"}</b></div><div class="fact"><small>Último login</small><b>${date(p.ultimo_login_at)}</b></div>
</div>
<div class="actions">
${p.estado_verificacion!=="verificado"?'<button class="btn ok" data-action="verificar">Verificar</button>':""}
${p.estado_verificacion!=="rechazado"?'<button class="btn warn" data-action="rechazar">Rechazar</button>':""}
${canSuspend&&p.estado_cuenta!=="suspendida"?'<button class="btn danger" data-action="suspender">Suspender</button>':""}
${canSuspend&&p.estado_cuenta==="suspendida"?'<button class="btn ok" data-action="reactivar">Reactivar</button>':""}
</div>
${p.motivo_suspension?`<div class="claim"><b>Motivo suspensión</b><br>${esc(p.motivo_suspension)}</div>`:""}
${p.observacion_admin?`<div class="claim"><b>Observación interna</b><br>${esc(p.observacion_admin)}</div>`:""}
<div class="section"><h3>Historial administrativo (${hist.length})</h3>${hist.length?hist.map(x=>`<div class="event"><b>${esc(x.accion)}</b> · ${date(x.created_at)}<br><span class="meta">${esc(x.estado_anterior||"—")} → ${esc(x.estado_nuevo||"—")}${x.observacion?" · "+esc(x.observacion):""}</span></div>`).join(""):'<div class="meta">Sin acciones administrativas.</div>'}</div>
<div class="section"><h3>Reclamos (${claims.length})</h3>${claims.length?claims.map(x=>`<div class="claim"><b>${esc(x.categoria)}</b> ${badge(x.estado)}<br>${esc(x.descripcion)}<div class="meta">${date(x.created_at)} · Reporta: ${esc(x.reportante_tipo)}</div></div>`).join(""):'<div class="meta">Sin reclamos registrados.</div>'}</div>`;
document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>openAction(b.dataset.action,p))}
function openAction(action,p){pendingAction={action,p};$("modalTitle").textContent={verificar:"Verificar prestador",rechazar:"Rechazar verificación",suspender:"Suspender prestador",reactivar:"Reactivar prestador"}[action];$("modalText").textContent=`${p.nombre||"Prestador"} · ${p.email||p.telefono||""}`;$("observation").value="";$("observation").placeholder=action==="suspender"?"Motivo de suspensión (obligatorio)":"Observación interna (opcional)";$("modalBg").classList.remove("hidden")}
$("cancelModal").onclick=()=>{$("modalBg").classList.add("hidden");pendingAction=null}
$("confirmAction").onclick=async()=>{if(!pendingAction)return;const obs=$("observation").value.trim();if(pendingAction.action==="suspender"&&!obs){alert("Debes indicar el motivo de la suspensión.");return}$("confirmAction").disabled=true;try{await api(`/admin/prestadores/${pendingAction.p.id}/accion`,{method:"POST",body:JSON.stringify({accion:pendingAction.action,observacion:obs})});$("modalBg").classList.add("hidden");const id=pendingAction.p.id;pendingAction=null;await loadProviders();await openProvider(id)}catch(e){alert(e.message)}finally{$("confirmAction").disabled=false}}
$("refresh").onclick=loadProviders;$("verification").onchange=loadProviders;$("account").onchange=loadProviders;let timer;$("search").oninput=()=>{clearTimeout(timer);timer=setTimeout(loadProviders,350)}
restore();
</script>
</body>
</html>
